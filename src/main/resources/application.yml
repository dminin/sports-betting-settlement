spring:
  application:
    name: bet-settlement-service
  datasource:
    url: jdbc:h2:mem:bets;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: bet-settlement-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: com.sporty.settlement.adapter.messaging.EventOutcomeMessage
        spring.json.use.type.headers: false

app:
  kafka:
    event-outcomes-topic: event-outcomes
    event-outcomes-partitions: 3
  rocketmq:
    endpoint: localhost:8081
    topic: bet-settlements
    consumer-group: bet-settlement-consumer
  seed:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.sporty.settlement: INFO
    org.apache.rocketmq: WARN
    org.apache.kafka: WARN
